version: '3.8'

services:
  ezlinkai:
    image: ye4293xx7/one-api:latest
    container_name: ezlinkai2
    restart: always
    command: --log-dir /app/logs
    ports:
      - "5001:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    # 凭据一律从 .env 读，不写进本文件 —— 本文件受 git 跟踪。
    # 见 .env.example；.env 已被 .gitignore 覆盖。
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # NODE_TYPE 必须是 master：model/main.go 的整段迁移被
      # `if !config.IsMasterNode { return }` 门住，不设则全新库一张表都不会建，
      # provider id 的唯一索引也不会创建。多实例部署时只有一个设 master。
      - NODE_TYPE=master
      # FRONTEND_BASE_URL 指向 Next 前端。不设的话后端会在 / 上服务
      # 内嵌的老 React UI（Dockerfile 会把 web/default 构建进二进制），
      # 而那套 UI 仍在调已下线的 /api/oauth/state、/api/oauth/github。
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - SYNC_FREQUENCY=120
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
      - BATCH_UPDATE_INTERVAL=5
      - SQL_MAX_IDLE_CONNS=50
      - SQL_MAX_OPEN_CONNS=300
      - SQL_MAX_LIFETIME=1800
      - RELAY_TIMEOUT=1800
      - STREAMING_TIMEOUT=600
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
