name: Restore published Docker image tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to restore
        required: true
      digest:
        description: Verified existing Docker Hub manifest digest
        required: true

permissions:
  contents: read

jobs:
  restore-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release reference
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore tag from immutable manifest
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "ye4293xx7/linkinfra:${IMAGE_TAG}" \
            "ye4293xx7/linkinfra@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "ye4293xx7/linkinfra:${IMAGE_TAG}"
